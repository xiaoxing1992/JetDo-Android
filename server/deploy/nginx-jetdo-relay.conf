# JetDo 崩溃上报 / 推送中继 —— nginx 站点配置
# 由 deploy.sh 渲染 __DOMAIN__ / __PORT__ 后安装到 conf.d；请勿手改已部署的副本。
#
# 设计取舍：这个域名只暴露 3 个端点，其余一律 404。
# 不和已有站点共用 server 块——server_name 不匹配时会落到 <existing-host> 那个 server，
# 它的 location / 反代到已死的 127.0.0.1:8080，行为不可预期。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME http-01 验证走这里。必须写在 redirect 之前，否则续期会被 301 打断。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 注意：nginx 1.24（Ubuntu 24.04 自带）不支持 `http2 on;`，那是 1.25.1+ 的语法，
    # 写成独立指令会让 nginx -t 直接报 unknown directive。必须挂在 listen 上。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.pem;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jetdo_ssl:10m;

    access_log /var/log/nginx/jetdo-relay.access.log;
    error_log  /var/log/nginx/jetdo-relay.error.log;

    # 崩溃上报入口。ACRA 用 gzip 压缩后通常 < 30KB，
    # 这里放宽到 8m 是为了对齐 relay.py 的 CRASH_MAX_UPLOAD_BYTES 默认值；
    # nginx 默认只有 1m，不改会在 413 处把报告直接丢掉。
    location = /crash {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
    }

    # 统计接口暴露了崩溃量、磁盘占用等运营信息，默认关闭。
    # 需要查看时把 deny all 换成自己的固定出口 IP：
    #   allow 1.2.3.4; deny all;
    location = /crash/stats {
        deny all;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
